databaseChangeLog:
  # MARK_RAN cho phép Liquibase tiếp quản database cũ đã được Hibernate tạo.
  # Database mới vẫn chạy đầy đủ schema theo đúng thứ tự phụ thuộc.
  - changeSet:
      id: 000-core-schema
      author: my-interview-team
      preConditions:
        - onFail: MARK_RAN
        - not:
            - tableExists:
                tableName: user_accounts
      changes:
        - sqlFile:
            path: db/changelog/000-core-schema.sql
            splitStatements: true
            stripComments: true

