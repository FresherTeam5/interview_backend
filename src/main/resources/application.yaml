spring:
  application:
    name: BaseProject
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/interview_thaitruong?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false

  liquibase:
    enabled: ${LIQUIBASE_ENABLED:true}
    change-log: classpath:db/changelog/db.changelog-master.yaml

  servlet:
    multipart:
      # Cao hơn giới hạn từng feature để validator trả đúng mã lỗi nghiệp vụ.
      max-file-size: 16MB
      max-request-size: 17MB

  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${MAIL_SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${MAIL_STARTTLS:false}

  ai:
    openai:
      api-key: ${OPENROUTER_API_KEY}
      base-url: ${AI_BASE_URL:https://openrouter.ai/api/v1/chat/completions}
      chat:
        timeout: ${AI_TIMEOUT:25s}
        max-retries: ${AI_MAX_RETRIES:0}
        options:
          model: ${AI_MODEL:inclusionai/ling-3.0-flash-sante:free}
          temperature: ${AI_TEMPERATURE:0.1}

springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:true}
    path: /v3/api-docs
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:true}
    path: /swagger-ui.html
    with-credentials: true
    persist-authorization: true
    display-request-duration: true
    tags-sorter: alpha
    operations-sorter: method

app:
  admin:
    announcement-cron: ${ADMIN_ANNOUNCEMENT_CRON:0 * * * * *}
    job-history-cleanup-cron: ${ADMIN_JOB_HISTORY_CLEANUP_CRON:0 30 3 * * *}
    job-recovery-ms: ${ADMIN_JOB_RECOVERY_MS:3600000}

  account:
    email-verification-ttl-minutes: ${EMAIL_VERIFICATION_TTL_MINUTES:1440}
    password-reset-ttl-minutes: ${PASSWORD_RESET_TTL_MINUTES:30}
    deletion-grace-days: ${ACCOUNT_DELETION_GRACE_DAYS:7}
    frontend-base-url: ${FRONTEND_BASE_URL:http://localhost:5173}
    mail-enabled: ${MAIL_ENABLED:false}
    mail-from: ${MAIL_FROM:no-reply@my-interview.local}
    token-cleanup-cron: ${ACCOUNT_TOKEN_CLEANUP_CRON:0 15 2 * * *}
    deletion-cron: ${ACCOUNT_DELETION_CRON:0 */15 * * * *}
    storage-deletion-cron: ${STORAGE_DELETION_CRON:30 */5 * * * *}

  admin-bootstrap:
    enabled: ${APP_ADMIN_BOOTSTRAP_ENABLED:false}
    email: ${APP_ADMIN_BOOTSTRAP_EMAIL:thaitruong@admin.com}
    password: ${APP_ADMIN_BOOTSTRAP_PASSWORD:12345678}
    full-name: ${APP_ADMIN_BOOTSTRAP_FULL_NAME:System Administrator}

  jwt:
    secret: ${JWT_SECRET:eventhub-dev-only-secret-key-2026-doi-truoc-khi-deploy}
    expiration-ms: ${JWT_EXPIRATION_MS:9000000}

  refresh-token:
    expiration-ms: ${REFRESH_TOKEN_EXPIRATION_MS:604800000}
    cookie-name: ${REFRESH_TOKEN_COOKIE_NAME:refresh_token}
    # only auth apis need cookie
    cookie-path: ${REFRESH_TOKEN_COOKIE_PATH:/api/auth}
    cookie-secure: ${REFRESH_TOKEN_COOKIE_SECURE:false}
    cookie-same-site: ${REFRESH_TOKEN_COOKIE_SAME_SITE:Lax}
    cleanup-cron: ${REFRESH_TOKEN_CLEANUP_CRON:0 0 2 * * *}

  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

  oauth:
    google:
      client-id: ${GOOGLE_CLIENT_ID:1063418979323-9esrkg9ef25jofnrjrrkdgcduhaffaia.apps.googleusercontent.com}
      jwk-set-uri: ${GOOGLE_JWK_SET_URI:https://www.googleapis.com/oauth2/v3/certs}
      issuers: ${GOOGLE_ISSUERS:https://accounts.google.com,accounts.google.com}

  storage:
    endpoint: ${STORAGE_ENDPOINT:http://localhost:9000}
    access-key: ${STORAGE_ACCESS_KEY:minioadmin}
    secret-key: ${STORAGE_SECRET_KEY:minioadmin}
    bucket-name: ${STORAGE_BUCKET_NAME:interview-store}
    region: ${STORAGE_REGION:us-east-1}

  cv:
    max-file-size-bytes: ${CV_MAX_FILE_SIZE_BYTES:5242880}
    max-pages: ${CV_MAX_PAGES:10}
    max-per-user: ${CV_MAX_PER_USER:10}

  job-description:
    max-file-size-bytes: ${JD_MAX_FILE_SIZE_BYTES:5242880}
    max-pages: ${JD_MAX_PAGES:20}
    max-per-user: ${JD_MAX_PER_USER:50}
    max-text-characters: ${JD_MAX_TEXT_CHARACTERS:30000}

  interview-session:
    supported-languages: ${INTERVIEW_SUPPORTED_LANGUAGES:vi,en,ja}
    supported-durations: ${INTERVIEW_SUPPORTED_DURATIONS:15,30,45,60}
    supported-modes: ${INTERVIEW_SUPPORTED_MODES:TURN_BASED,VOICE_REALTIME}
    deadline-sweep-ms: ${INTERVIEW_DEADLINE_SWEEP_MS:30000}

  interview-scoring:
    minimum-coverage-percentage: ${INTERVIEW_MINIMUM_SCORING_COVERAGE:50}
    technical-weight: ${INTERVIEW_TECHNICAL_SCORE_WEIGHT:0.8}
    communication-weight: ${INTERVIEW_COMMUNICATION_SCORE_WEIGHT:0.2}

  realtime:
    enabled: ${REALTIME_ENABLED:true}
    provider: ${REALTIME_PROVIDER:gemini-live}
    providers:
      gemini-live:
        base-url: ${GEMINI_LIVE_BASE_URL:https://generativelanguage.googleapis.com}
        websocket-endpoint: ${GEMINI_LIVE_WEBSOCKET_ENDPOINT:wss://generativelanguage.googleapis.com/ws/google.ai.generativelanguage.v1beta.GenerativeService.BidiGenerateContentConstrained}
        api-key: ${GEMINI_API_KEY:}
        model: ${GEMINI_LIVE_MODEL:gemini-3.1-flash-live-preview}
        default-voice: ${GEMINI_LIVE_DEFAULT_VOICE:Kore}
        supported-voices: ${GEMINI_LIVE_SUPPORTED_VOICES:Zephyr,Puck,Charon,Kore,Fenrir,Leda,Orus,Aoede,Callirrhoe,Autonoe,Enceladus,Iapetus,Umbriel,Algieba,Despina,Erinome,Algenib,Rasalgethi,Laomedeia,Achernar,Alnilam,Schedar,Gacrux,Pulcherrima,Achird,Zubenelgenubi,Vindemiatrix,Sadachbia,Sadaltager,Sulafat}
        connect-timeout: ${GEMINI_LIVE_CONNECT_TIMEOUT:5s}
        read-timeout: ${GEMINI_LIVE_READ_TIMEOUT:15s}
        new-session-ttl: ${GEMINI_LIVE_NEW_SESSION_TTL:1m}
        token-lifetime-buffer: ${GEMINI_LIVE_TOKEN_LIFETIME_BUFFER:15m}
        input-sample-rate: ${GEMINI_LIVE_INPUT_SAMPLE_RATE:16000}
        output-sample-rate: ${GEMINI_LIVE_OUTPUT_SAMPLE_RATE:24000}

  speech:
    enabled: ${SPEECH_ENABLED:true}
    stt-provider: ${SPEECH_STT_PROVIDER:elevenlabs}
    tts-provider: ${SPEECH_TTS_PROVIDER:elevenlabs}
    max-audio-size-bytes: ${SPEECH_MAX_AUDIO_SIZE_BYTES:10485760}
    connect-timeout: ${SPEECH_CONNECT_TIMEOUT:5s}
    read-timeout: ${SPEECH_READ_TIMEOUT:45s}

    providers:
      elevenlabs:
        api-key: ${ELEVENLABS_API_KEY:}
        base-url: ${ELEVENLABS_BASE_URL:https://api.elevenlabs.io}
        stt-model: ${ELEVENLABS_STT_MODEL:scribe_v2}
        tts-model: ${ELEVENLABS_TTS_MODEL:eleven_flash_v2_5}
        output-format: ${ELEVENLABS_OUTPUT_FORMAT:mp3_44100_128}
        voices:
          en: ${ELEVENLABS_VOICE_EN:sDLPLA42F3JDFlBx0oRp}
          ja: ${ELEVENLABS_VOICE_JA:sDLPLA42F3JDFlBx0oRp}
          vi: ${ELEVENLABS_VOICE_VI:sDLPLA42F3JDFlBx0oRp}
