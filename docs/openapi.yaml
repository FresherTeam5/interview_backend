openapi: 3.0.3
info:
  title: My Interview API
  version: 1.0.0
  description: Frontend contract verified against the current Spring Boot implementation.
servers:
  - url: http://localhost:8080
tags:
  - name: Auth
    description: Authentication, token rotation, and current-user endpoints.
  - name: CV and Profile
    description: Combined CV upload, parsing, review, editing, and confirmation flow.
  - name: JD and Template
    description: Combined job-description analysis and interview-template flow.
  - name: Interview
    description: Interview preparation, conversation, scoring, and reporting.
  - name: Interview Speech
    description: Provider-independent transcription and interviewer speech synthesis.
  - name: Admin
    description: Administrator dashboard, account management, and interview operations.

paths:
  /api/auth/register:
    post:
      tags: [Auth]
      operationId: register
      summary: Register a user
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RegisterRequest'}
      responses:
        '201':
          description: Registered; also sets the refresh-token cookie.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AuthResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/auth/login:
    post:
      tags: [Auth]
      operationId: login
      summary: Log in with email and password
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/LoginRequest'}
      responses:
        '200':
          description: Logged in; also sets the refresh-token cookie.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AuthResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /api/auth/google:
    post:
      tags: [Auth]
      operationId: loginWithGoogle
      summary: Log in with a Google ID token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/GoogleLoginRequest'}
      responses:
        '200':
          description: Logged in; also sets the refresh-token cookie.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AuthResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
  /api/auth/me:
    get:
      tags: [Auth]
      operationId: getCurrentUser
      summary: Get the current user
      responses:
        '200':
          description: Current user.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CurrentUserResponse'}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /api/auth/refresh:
    post:
      tags: [Auth]
      operationId: refreshAccessToken
      summary: Rotate the refresh token
      security:
        - refreshCookie: []
      responses:
        '200':
          description: Rotated refresh token and new access token.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AuthResponse'}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /api/auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      summary: Log out the current device
      security: []
      responses:
        '204': {description: Logged out and refresh cookie cleared.}
  /api/auth/logout-all:
    post:
      tags: [Auth]
      operationId: logoutAll
      summary: Log out all devices
      responses:
        '204': {description: All refresh tokens revoked.}
        '401': {$ref: '#/components/responses/Unauthorized'}

  /api/cvs:
    post:
      tags: [CV and Profile]
      operationId: uploadCv
      summary: Upload and parse a CV
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: {type: string, format: binary}
      responses:
        '200':
          description: Reused an existing parsed CV and profile.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CvDocument'}
        '202':
          description: Created and queued a new CV.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CvDocument'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '413': {$ref: '#/components/responses/ContentTooLarge'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
    get:
      tags: [CV and Profile]
      operationId: listCvs
      summary: List active CVs
      responses:
        '200':
          description: Active CVs, newest first.
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/CvDocument'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /api/cvs/{cvId}:
    parameters:
      - {$ref: '#/components/parameters/CvId'}
    get:
      tags: [CV and Profile]
      operationId: getCv
      summary: Get CV processing status
      responses:
        '200':
          description: CV status.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CvDocument'}
        '404': {$ref: '#/components/responses/NotFound'}
    delete:
      tags: [CV and Profile]
      operationId: deleteCv
      summary: Soft-delete a CV
      responses:
        '204': {description: Soft-deleted.}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/cvs/{cvId}/file:
    parameters:
      - {$ref: '#/components/parameters/CvId'}
    get:
      tags: [CV and Profile]
      operationId: getCvFileUrl
      summary: Get a temporary CV file URL
      responses:
        '200':
          description: Presigned URL valid for five minutes.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/FileUrlResponse'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/cvs/{cvId}/parse:
    parameters:
      - {$ref: '#/components/parameters/CvId'}
    post:
      tags: [CV and Profile]
      operationId: retryCvParse
      summary: Retry failed CV parsing
      responses:
        '202':
          description: Parsing redispatched.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CvDocument'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}

  /api/profiles:
    get:
      tags: [CV and Profile]
      operationId: listProfiles
      summary: List candidate profiles
      responses:
        '200':
          description: Profiles backed by active CVs.
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/ProfileSummary'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /api/profiles/{profileId}:
    parameters:
      - {$ref: '#/components/parameters/ProfileId'}
    get:
      tags: [CV and Profile]
      operationId: getProfile
      summary: Get a candidate profile
      responses:
        '200':
          description: Candidate profile.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CandidateProfile'}
        '404': {$ref: '#/components/responses/NotFound'}
    put:
      tags: [CV and Profile]
      operationId: updateProfile
      summary: Replace a candidate profile
      description: Full replacement of scalars and all three child collections.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ProfileUpdateRequest'}
      responses:
        '200':
          description: Updated profile.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CandidateProfile'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/profiles/{profileId}/confirm:
    parameters:
      - {$ref: '#/components/parameters/ProfileId'}
    post:
      tags: [CV and Profile]
      operationId: confirmProfile
      summary: Confirm a candidate profile
      responses:
        '200':
          description: Confirmed profile; the operation is idempotent.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CandidateProfile'}
        '404': {$ref: '#/components/responses/NotFound'}

  /api/job-descriptions:
    post:
      tags: [JD and Template]
      operationId: createJobDescription
      summary: Submit a PDF or text job description
      description: Select request-body content type to upload a PDF or submit text.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: {type: string, format: binary}
          application/json:
            schema: {$ref: '#/components/schemas/CreateJobDescriptionTextRequest'}
      responses:
        '200':
          description: Reused a ready JD with an editable draft template.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/JobDescription'}
        '202':
          description: Created and queued a new JD.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/JobDescription'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '409': {$ref: '#/components/responses/Conflict'}
        '413': {$ref: '#/components/responses/ContentTooLarge'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
    get:
      tags: [JD and Template]
      operationId: listJobDescriptions
      summary: List active job descriptions
      responses:
        '200':
          description: Active JDs, newest first.
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/JobDescription'}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /api/job-descriptions/{jobDescriptionId}:
    parameters:
      - {$ref: '#/components/parameters/JobDescriptionId'}
    get:
      tags: [JD and Template]
      operationId: getJobDescription
      summary: Get job-description processing status
      responses:
        '200':
          description: JD pipeline status.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/JobDescription'}
        '404': {$ref: '#/components/responses/NotFound'}
    delete:
      tags: [JD and Template]
      operationId: deleteJobDescription
      summary: Soft-delete a job description
      responses:
        '204': {description: Soft-deleted; its template is retained.}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/job-descriptions/{jobDescriptionId}/file:
    parameters:
      - {$ref: '#/components/parameters/JobDescriptionId'}
    get:
      tags: [JD and Template]
      operationId: getJobDescriptionFileUrl
      summary: Get a temporary job-description file URL
      responses:
        '200':
          description: Presigned URL valid for five minutes.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/FileUrlResponse'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/job-descriptions/{jobDescriptionId}/analysis:
    parameters:
      - {$ref: '#/components/parameters/JobDescriptionId'}
    get:
      tags: [JD and Template]
      operationId: getJobDescriptionAnalysis
      summary: Get immutable job-description analysis
      responses:
        '200':
          description: Immutable extracted text and AI analysis.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/JobDescriptionAnalysisResponse'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/job-descriptions/{jobDescriptionId}/retry:
    parameters:
      - {$ref: '#/components/parameters/JobDescriptionId'}
    post:
      tags: [JD and Template]
      operationId: retryJobDescription
      summary: Retry failed job-description processing
      responses:
        '202':
          description: Processing redispatched.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/JobDescription'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}

  /api/interview-templates:
    get:
      tags: [JD and Template]
      operationId: listInterviewTemplates
      summary: List owned or public templates
      parameters:
        - name: scope
          in: query
          schema: {type: string, enum: [mine, public], default: mine}
        - name: page
          in: query
          schema: {type: integer, minimum: 0, default: 0}
        - name: size
          in: query
          schema: {type: integer, minimum: 1, maximum: 100, default: 20}
      responses:
        '200':
          description: Template page.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TemplatePage'}
        '400': {$ref: '#/components/responses/BadRequest'}
  /api/interview-templates/{templateId}:
    parameters:
      - {$ref: '#/components/parameters/TemplateId'}
    get:
      tags: [JD and Template]
      operationId: getInterviewTemplate
      summary: Get an interview template
      responses:
        '200':
          description: Owned or public template.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/InterviewTemplate'}
        '404': {$ref: '#/components/responses/NotFound'}
    put:
      tags: [JD and Template]
      operationId: updateInterviewTemplate
      summary: Update a draft interview template
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UpdateInterviewTemplateRequest'}
      responses:
        '200':
          description: Updated draft template.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/InterviewTemplate'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Unprocessable'}
  /api/interview-templates/{templateId}/confirm:
    parameters:
      - {$ref: '#/components/parameters/TemplateId'}
    post:
      tags: [JD and Template]
      operationId: confirmInterviewTemplate
      summary: Confirm and freeze a template
      requestBody: {$ref: '#/components/requestBodies/TemplateVersion'}
      responses:
        '200':
          description: Confirmed and frozen template.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/InterviewTemplate'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/interview-templates/{templateId}/publish:
    parameters:
      - {$ref: '#/components/parameters/TemplateId'}
    post:
      tags: [JD and Template]
      operationId: publishInterviewTemplate
      summary: Publish a confirmed template
      description: Requires ADMIN and ownership.
      requestBody: {$ref: '#/components/requestBodies/TemplateVersion'}
      responses:
        '200':
          description: Published template.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/InterviewTemplate'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/interview-templates/{templateId}/unpublish:
    parameters:
      - {$ref: '#/components/parameters/TemplateId'}
    post:
      tags: [JD and Template]
      operationId: unpublishInterviewTemplate
      summary: Unpublish a template
      description: Requires ADMIN and ownership.
      requestBody: {$ref: '#/components/requestBodies/TemplateVersion'}
      responses:
        '200':
          description: Unpublished template.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/InterviewTemplate'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/interview-templates/{templateId}/archive:
    parameters:
      - {$ref: '#/components/parameters/TemplateId'}
    post:
      tags: [JD and Template]
      operationId: archiveInterviewTemplate
      summary: Archive a template
      requestBody: {$ref: '#/components/requestBodies/TemplateVersion'}
      responses:
        '200':
          description: Archived and unpublished template.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/InterviewTemplate'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}

  /api/interview-session-options:
    get:
      tags: [Interview]
      operationId: getInterviewSessionOptions
      summary: Get supported interview options
      responses:
        '200':
          description: Server-supported options.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/InterviewSessionOptions'}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /api/interview-sessions:
    post:
      tags: [Interview]
      operationId: createInterviewSession
      summary: Create and prepare an interview session
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateInterviewSessionRequest'}
      responses:
        '202':
          description: Existing or newly created session; preparation is asynchronous.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/InterviewSessionStatus'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/interview-sessions/{sessionId}:
    parameters:
      - {$ref: '#/components/parameters/SessionId'}
    get:
      tags: [Interview]
      operationId: getInterviewSession
      summary: Get interview session status
      responses:
        '200':
          description: Session state.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/InterviewSessionStatus'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/interview-sessions/{sessionId}/preparation/retry:
    parameters:
      - {$ref: '#/components/parameters/SessionId'}
    post:
      tags: [Interview]
      operationId: retryInterviewPreparation
      summary: Retry failed interview preparation
      responses:
        '202':
          description: Preparation redispatched.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/InterviewSessionStatus'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/interview-sessions/{sessionId}/realtime/session-grants:
    parameters:
      - {$ref: '#/components/parameters/SessionId'}
    post:
      tags: [Interview]
      operationId: createRealtimeSessionGrant
      summary: Create a constrained realtime provider grant
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateRealtimeSessionRequest'}
      responses:
        '200':
          description: Short-lived token and WebSocket setup.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RealtimeSessionGrant'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '502': {$ref: '#/components/responses/BadGateway'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
        '504': {$ref: '#/components/responses/GatewayTimeout'}
  /api/interview-sessions/{sessionId}/realtime/connections/{connectionId}/events:
    parameters:
      - {$ref: '#/components/parameters/SessionId'}
      - name: connectionId
        in: path
        required: true
        schema: {type: integer, format: int64}
    post:
      tags: [Interview]
      operationId: recordRealtimeEvents
      summary: Persist realtime events and final transcript turns
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RealtimeEventBatchRequest'}
      responses:
        '200':
          description: Idempotent batch result.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RealtimeEventBatchResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/interview-sessions/{sessionId}/realtime/connections/{connectionId}/resume-grants:
    parameters:
      - {$ref: '#/components/parameters/SessionId'}
      - name: connectionId
        in: path
        required: true
        schema: {type: integer, format: int64}
    post:
      tags: [Interview]
      operationId: resumeRealtimeConnection
      summary: Create a new constrained grant from a resumption handle
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateRealtimeResumeRequest'}
      responses:
        '200':
          description: New connection ID, token and provider setup.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RealtimeSessionGrant'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '502': {$ref: '#/components/responses/BadGateway'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
        '504': {$ref: '#/components/responses/GatewayTimeout'}
  /api/interview-sessions/{sessionId}/realtime/connections/{connectionId}/disconnect:
    parameters:
      - {$ref: '#/components/parameters/SessionId'}
      - name: connectionId
        in: path
        required: true
        schema: {type: integer, format: int64}
    post:
      tags: [Interview]
      operationId: disconnectRealtimeConnection
      summary: Close a connection and optionally fall back to turn-based voice
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/DisconnectRealtimeConnectionRequest'}
      responses:
        '200':
          description: Persisted connection status.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RealtimeConnection'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/interview-sessions/{sessionId}/start:
    parameters:
      - {$ref: '#/components/parameters/SessionId'}
    post:
      tags: [Interview]
      operationId: startInterview
      summary: Start a prepared interview
      responses:
        '200':
          description: Started or already-running conversation.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/InterviewConversation'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/interview-sessions/{sessionId}/conversation:
    parameters:
      - {$ref: '#/components/parameters/SessionId'}
    get:
      tags: [Interview]
      operationId: getInterviewConversation
      summary: Get the persisted conversation
      responses:
        '200':
          description: Persisted conversation and timer snapshot.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/InterviewConversation'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/interview-sessions/{sessionId}/answers:
    parameters:
      - {$ref: '#/components/parameters/SessionId'}
    post:
      tags: [Interview]
      operationId: submitInterviewAnswer
      summary: Submit an answer and generate a reply
      description: Long-running synchronous AI request; reuse the same key and payload on retry.
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SubmitInterviewAnswerRequest'}
      responses:
        '200':
          description: Candidate turn plus persisted interviewer reply, if one was produced.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/InterviewAnswerResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '500': {$ref: '#/components/responses/ServerError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
        '504': {$ref: '#/components/responses/GatewayTimeout'}
  /api/interview-sessions/{sessionId}/speech/transcriptions:
    parameters:
      - {$ref: '#/components/parameters/SessionId'}
    post:
      tags: [Interview Speech]
      operationId: transcribeInterviewAnswer
      summary: Transcribe a candidate answer in the session language
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [audio]
              properties:
                audio: {type: string, format: binary}
      responses:
        '200':
          description: Transcript ready to submit through the existing answer API.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SpeechTranscription'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '404': {$ref: '#/components/responses/NotFound'}
        '413': {$ref: '#/components/responses/ContentTooLarge'}
        '502': {$ref: '#/components/responses/BadGateway'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
        '504': {$ref: '#/components/responses/GatewayTimeout'}
  /api/interview-sessions/{sessionId}/speech/turns/{turnId}/audio:
    parameters:
      - {$ref: '#/components/parameters/SessionId'}
      - {$ref: '#/components/parameters/TurnId'}
    post:
      tags: [Interview Speech]
      operationId: createInterviewerTurnAudio
      summary: Generate or retrieve audio for an interviewer turn
      responses:
        '200':
          description: MP3 speech generated from the persisted interviewer turn.
          content:
            audio/mpeg:
              schema: {type: string, format: binary}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '502': {$ref: '#/components/responses/BadGateway'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
        '504': {$ref: '#/components/responses/GatewayTimeout'}
  /api/interview-sessions/{sessionId}/finish:
    parameters:
      - {$ref: '#/components/parameters/SessionId'}
    post:
      tags: [Interview]
      operationId: finishInterview
      summary: Finish an interview early
      responses:
        '200':
          description: Conversation after moving to scoring.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/InterviewConversation'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/interview-sessions/{sessionId}/report:
    parameters:
      - {$ref: '#/components/parameters/SessionId'}
    get:
      tags: [Interview]
      operationId: getInterviewReport
      summary: Get scoring status or report
      responses:
        '200':
          description: Scoring status, failure, or completed report.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/InterviewReport'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/interview-sessions/{sessionId}/scoring/retry:
    parameters:
      - {$ref: '#/components/parameters/SessionId'}
    post:
      tags: [Interview]
      operationId: retryInterviewScoring
      summary: Retry failed scoring
      responses:
        '202':
          description: Scoring redispatched.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/InterviewReport'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}

  /api/admin/overview:
    get:
      tags: [Admin]
      operationId: getAdminOverview
      summary: Get administrator overview metrics
      parameters:
        - name: days
          in: query
          required: false
          schema: {type: integer, minimum: 1, maximum: 90, default: 7}
      responses:
        '200':
          description: User, interview-session, and published-template metrics.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AdminOverview'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}

  /api/admin/users:
    get:
      tags: [Admin]
      operationId: listAdminUsers
      summary: Search and filter user accounts
      parameters:
        - name: keyword
          in: query
          required: false
          schema: {type: string}
        - name: role
          in: query
          required: false
          schema: {$ref: '#/components/schemas/UserRole'}
        - name: enabled
          in: query
          required: false
          schema: {type: boolean}
        - name: page
          in: query
          required: false
          schema: {type: integer, minimum: 0, default: 0}
        - name: size
          in: query
          required: false
          schema: {type: integer, minimum: 1, maximum: 100, default: 20}
      responses:
        '200':
          description: Matching accounts ordered newest first.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AdminUserPage'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}

  /api/admin/users/{userId}:
    parameters:
      - {$ref: '#/components/parameters/UserId'}
    get:
      tags: [Admin]
      operationId: getAdminUser
      summary: Get account details and activity counts
      responses:
        '200':
          description: Account details.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AdminUserDetail'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}

  /api/admin/users/{userId}/status:
    parameters:
      - {$ref: '#/components/parameters/UserId'}
    patch:
      tags: [Admin]
      operationId: updateAdminUserStatus
      summary: Enable or disable a USER account
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UpdateUserStatusRequest'}
      responses:
        '200':
          description: Updated account. Disabling also revokes all refresh tokens.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AdminUserDetail'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}

  /api/admin/interview-sessions:
    get:
      tags: [Admin]
      operationId: listAdminInterviewSessions
      summary: Search and filter all interview sessions
      parameters:
        - name: keyword
          in: query
          required: false
          description: Case-insensitive owner name or email search.
          schema: {type: string}
        - name: status
          in: query
          required: false
          schema: {$ref: '#/components/schemas/InterviewSessionStatusEnum'}
        - name: mode
          in: query
          required: false
          schema: {$ref: '#/components/schemas/InterviewSessionMode'}
        - name: from
          in: query
          required: false
          schema: {type: string, format: date-time}
        - name: to
          in: query
          required: false
          schema: {type: string, format: date-time}
        - name: page
          in: query
          required: false
          schema: {type: integer, minimum: 0, default: 0}
        - name: size
          in: query
          required: false
          schema: {type: integer, minimum: 1, maximum: 100, default: 20}
      responses:
        '200':
          description: Matching sessions ordered newest first.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AdminSessionPage'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}

  /api/admin/interview-sessions/{sessionId}:
    parameters:
      - {$ref: '#/components/parameters/SessionId'}
    get:
      tags: [Admin]
      operationId: getAdminInterviewSession
      summary: Get interview-session operational details
      responses:
        '200':
          description: Session metadata, processing errors, and transition history.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AdminSessionDetail'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}

  /api/admin/interview-sessions/{sessionId}/preparation/retry:
    parameters:
      - {$ref: '#/components/parameters/SessionId'}
    post:
      tags: [Admin]
      operationId: retryAdminInterviewPreparation
      summary: Retry failed interview preparation as an administrator
      responses:
        '202':
          description: Preparation redispatched.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AdminSessionDetail'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}

  /api/admin/interview-sessions/{sessionId}/scoring/retry:
    parameters:
      - {$ref: '#/components/parameters/SessionId'}
    post:
      tags: [Admin]
      operationId: retryAdminInterviewScoring
      summary: Retry failed interview scoring as an administrator
      responses:
        '202':
          description: Scoring redispatched.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AdminSessionDetail'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    refreshCookie:
      type: apiKey
      in: cookie
      name: refresh_token
  parameters:
    CvId:
      name: cvId
      in: path
      required: true
      schema: {type: integer, format: int64, minimum: 1}
    ProfileId:
      name: profileId
      in: path
      required: true
      schema: {type: integer, format: int64, minimum: 1}
    JobDescriptionId:
      name: jobDescriptionId
      in: path
      required: true
      schema: {type: integer, format: int64, minimum: 1}
    TemplateId:
      name: templateId
      in: path
      required: true
      schema: {type: integer, format: int64, minimum: 1}
    SessionId:
      name: sessionId
      in: path
      required: true
      schema: {type: integer, format: int64, minimum: 1}
    UserId:
      name: userId
      in: path
      required: true
      schema: {type: integer, format: int64, minimum: 1}
    TurnId:
      name: turnId
      in: path
      required: true
      schema: {type: integer, format: int64, minimum: 1}
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: {type: string, minLength: 1, maxLength: 100}
  requestBodies:
    TemplateVersion:
      required: true
      content:
        application/json:
          schema: {$ref: '#/components/schemas/TemplateVersionRequest'}
  responses:
    BadRequest:
      description: Invalid input.
      content: {application/json: {schema: {$ref: '#/components/schemas/ApiError'}}}
    Unauthorized:
      description: Missing or invalid authentication.
      content: {application/json: {schema: {$ref: '#/components/schemas/ApiError'}}}
    Forbidden:
      description: Authenticated but not allowed.
      content: {application/json: {schema: {$ref: '#/components/schemas/ApiError'}}}
    NotFound:
      description: Resource not found or inaccessible.
      content: {application/json: {schema: {$ref: '#/components/schemas/ApiError'}}}
    Conflict:
      description: State, idempotency, version, or limit conflict.
      content: {application/json: {schema: {$ref: '#/components/schemas/ApiError'}}}
    ContentTooLarge:
      description: Upload or text is too large.
      content: {application/json: {schema: {$ref: '#/components/schemas/ApiError'}}}
    UnsupportedMediaType:
      description: Only a valid PDF is accepted.
      content: {application/json: {schema: {$ref: '#/components/schemas/ApiError'}}}
    Unprocessable:
      description: Semantically invalid content or failed processing.
      content: {application/json: {schema: {$ref: '#/components/schemas/ApiError'}}}
    ServerError:
      description: Internal or AI-output error.
      content: {application/json: {schema: {$ref: '#/components/schemas/ApiError'}}}
    ServiceUnavailable:
      description: AI, storage, or configuration unavailable.
      content: {application/json: {schema: {$ref: '#/components/schemas/ApiError'}}}
    GatewayTimeout:
      description: AI or speech provider timed out.
      content: {application/json: {schema: {$ref: '#/components/schemas/ApiError'}}}
    BadGateway:
      description: An upstream provider returned an invalid response or rejected the request.
      content: {application/json: {schema: {$ref: '#/components/schemas/ApiError'}}}
  schemas:
    ApiError:
      type: object
      required: [timestamp, status, code, message, path]
      properties:
        timestamp: {type: string, format: date-time}
        status: {type: integer}
        code: {type: string}
        message: {type: string}
        path: {type: string}
        fieldErrors:
          type: object
          nullable: true
          additionalProperties: {type: string}
    UserRole: {type: string, enum: [ADMIN, USER]}
    RegisterRequest:
      type: object
      required: [fullName, email, password]
      properties:
        fullName: {type: string, minLength: 1, maxLength: 150}
        email: {type: string, format: email, minLength: 1, maxLength: 150}
        password: {type: string, minLength: 8, maxLength: 100, writeOnly: true}
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: {type: string, format: email}
        password: {type: string, minLength: 1, writeOnly: true}
    GoogleLoginRequest:
      type: object
      required: [idToken]
      properties:
        idToken: {type: string, minLength: 1, writeOnly: true}
    AuthResponse:
      type: object
      required: [accessToken, userId, email, role]
      properties:
        accessToken: {type: string}
        userId: {type: integer, format: int64}
        email: {type: string, format: email}
        role: {$ref: '#/components/schemas/UserRole'}
    CurrentUserResponse:
      type: object
      required: [id, fullName, email, role, createdAt, updatedAt]
      properties:
        id: {type: integer, format: int64}
        fullName: {type: string}
        email: {type: string, format: email}
        avatarUrl: {type: string, format: uri, nullable: true}
        role: {$ref: '#/components/schemas/UserRole'}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    AdminOverview:
      type: object
      required: [generatedAt, periodDays, users, sessions, templates]
      properties:
        generatedAt: {type: string, format: date-time}
        periodDays: {type: integer, minimum: 1, maximum: 90}
        users:
          type: object
          required: [total, enabled, newInPeriod]
          properties:
            total: {type: integer, format: int64, minimum: 0}
            enabled: {type: integer, format: int64, minimum: 0}
            newInPeriod: {type: integer, format: int64, minimum: 0}
        sessions:
          type: object
          required: [totalInPeriod, completed, inProgress, preparationFailed, scoringFailed, completionRate]
          properties:
            totalInPeriod: {type: integer, format: int64, minimum: 0}
            completed: {type: integer, format: int64, minimum: 0}
            inProgress: {type: integer, format: int64, minimum: 0}
            preparationFailed: {type: integer, format: int64, minimum: 0}
            scoringFailed: {type: integer, format: int64, minimum: 0}
            completionRate: {type: number, format: double, minimum: 0, maximum: 100}
        templates:
          type: object
          required: [published]
          properties:
            published: {type: integer, format: int64, minimum: 0}
    AdminUserSummary:
      type: object
      required: [id, fullName, email, role, enabled, createdAt, updatedAt]
      properties:
        id: {type: integer, format: int64}
        fullName: {type: string}
        email: {type: string, format: email}
        role: {$ref: '#/components/schemas/UserRole'}
        enabled: {type: boolean}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    AdminUserActivity:
      type: object
      required: [activeCvCount, activeJobDescriptionCount, interviewSessionCount, completedInterviewSessionCount]
      properties:
        activeCvCount: {type: integer, format: int64, minimum: 0}
        activeJobDescriptionCount: {type: integer, format: int64, minimum: 0}
        interviewSessionCount: {type: integer, format: int64, minimum: 0}
        completedInterviewSessionCount: {type: integer, format: int64, minimum: 0}
    AdminUserDetail:
      type: object
      required: [id, fullName, email, role, enabled, createdAt, updatedAt, activity]
      properties:
        id: {type: integer, format: int64}
        fullName: {type: string}
        email: {type: string, format: email}
        avatarUrl: {type: string, format: uri, nullable: true}
        role: {$ref: '#/components/schemas/UserRole'}
        enabled: {type: boolean}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
        activity: {$ref: '#/components/schemas/AdminUserActivity'}
    UpdateUserStatusRequest:
      type: object
      required: [enabled]
      properties:
        enabled: {type: boolean}
    AdminUserPage:
      type: object
      required: [items, page, size, totalElements]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/AdminUserSummary'}
        page: {type: integer, minimum: 0}
        size: {type: integer, minimum: 1}
        totalElements: {type: integer, format: int64, minimum: 0}
    AdminUserReference:
      type: object
      required: [id, fullName, email]
      properties:
        id: {type: integer, format: int64}
        fullName: {type: string}
        email: {type: string, format: email}
    AdminSessionSummary:
      type: object
      required: [id, user, status, templateTitle, profileName, mode, languageCode, durationMinutes, createdAt, updatedAt]
      properties:
        id: {type: integer, format: int64}
        user: {$ref: '#/components/schemas/AdminUserReference'}
        status: {$ref: '#/components/schemas/InterviewSessionStatusEnum'}
        templateTitle: {type: string}
        profileName: {type: string}
        mode: {$ref: '#/components/schemas/InterviewSessionMode'}
        languageCode: {type: string}
        durationMinutes: {type: integer, minimum: 1}
        preparationErrorCode: {type: string, nullable: true}
        scoringErrorCode: {type: string, nullable: true}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    AdminSessionPage:
      type: object
      required: [items, page, size, totalElements]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/AdminSessionSummary'}
        page: {type: integer, minimum: 0}
        size: {type: integer, minimum: 1}
        totalElements: {type: integer, format: int64, minimum: 0}
    InterviewTransitionActor:
      type: string
      enum: [USER, ADMIN, SYSTEM, SCHEDULER]
    AdminSessionTransition:
      type: object
      required: [id, toStatus, actor, occurredAt]
      properties:
        id: {type: integer, format: int64}
        fromStatus:
          allOf: [{$ref: '#/components/schemas/InterviewSessionStatusEnum'}]
          nullable: true
        toStatus: {$ref: '#/components/schemas/InterviewSessionStatusEnum'}
        reason: {type: string, nullable: true}
        actor: {$ref: '#/components/schemas/InterviewTransitionActor'}
        occurredAt: {type: string, format: date-time}
    AdminSessionDetail:
      type: object
      required: [id, user, status, templateTitle, profileName, languageCode, durationMinutes, interviewerStyle, mode, currentTurnIndex, createdAt, updatedAt, transitions]
      properties:
        id: {type: integer, format: int64}
        user: {$ref: '#/components/schemas/AdminUserReference'}
        status: {$ref: '#/components/schemas/InterviewSessionStatusEnum'}
        templateTitle: {type: string}
        profileName: {type: string}
        languageCode: {type: string}
        durationMinutes: {type: integer, minimum: 1}
        interviewerStyle: {$ref: '#/components/schemas/InterviewerStyle'}
        mode: {$ref: '#/components/schemas/InterviewSessionMode'}
        realtimeProvider: {type: string, nullable: true}
        realtimeVoiceName: {type: string, nullable: true}
        currentTurnIndex: {type: integer, minimum: 0}
        preparationErrorCode: {type: string, nullable: true}
        preparationErrorMessage: {type: string, nullable: true}
        planSchemaVersion: {type: string, nullable: true}
        planModelName: {type: string, nullable: true}
        planPromptVersion: {type: string, nullable: true}
        scoringErrorCode: {type: string, nullable: true}
        scoringErrorMessage: {type: string, nullable: true}
        preparationStartedAt: {type: string, format: date-time, nullable: true}
        preparedAt: {type: string, format: date-time, nullable: true}
        startedAt: {type: string, format: date-time, nullable: true}
        deadlineAt: {type: string, format: date-time, nullable: true}
        lastActivityAt: {type: string, format: date-time, nullable: true}
        endReason: {$ref: '#/components/schemas/InterviewEndReason'}
        endedAt: {type: string, format: date-time, nullable: true}
        scoringStartedAt: {type: string, format: date-time, nullable: true}
        completedAt: {type: string, format: date-time, nullable: true}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
        transitions:
          type: array
          items: {$ref: '#/components/schemas/AdminSessionTransition'}
    CvDocument:
      type: object
      required: [id, originalFilename, contentType, fileSizeBytes, status, uploadedAt, profileConfirmed]
      properties:
        id: {type: integer, format: int64}
        originalFilename: {type: string}
        contentType: {type: string}
        fileSizeBytes: {type: integer, format: int64}
        status: {type: string, enum: [UPLOADED, PARSING, PARSED, FAILED]}
        statusMessage: {type: string, nullable: true}
        uploadedAt: {type: string, format: date-time}
        parsedAt: {type: string, format: date-time, nullable: true}
        profileId: {type: integer, format: int64, nullable: true}
        profileConfirmed: {type: boolean}
        profileHeadline: {type: string, nullable: true}
    FileUrlResponse:
      type: object
      required: [url, expiresAt]
      properties:
        url: {type: string, format: uri}
        expiresAt: {type: string, format: date-time}
    ProfileEducation:
      type: object
      required: [school]
      properties:
        id: {type: integer, format: int64, minimum: 1, nullable: true}
        school: {type: string, minLength: 1, maxLength: 255}
        degree: {type: string, maxLength: 150, nullable: true}
        fieldOfStudy: {type: string, maxLength: 150, nullable: true}
        startYear: {type: integer, minimum: 1900, maximum: 2100, nullable: true}
        endYear: {type: integer, minimum: 1900, maximum: 2100, nullable: true}
        userEdited: {type: boolean, nullable: true, readOnly: true}
        displayOrder: {type: integer, nullable: true, readOnly: true}
    ProfileSkill:
      type: object
      required: [name]
      properties:
        id: {type: integer, format: int64, minimum: 1, nullable: true}
        name: {type: string, minLength: 1, maxLength: 80}
        category: {type: string, maxLength: 50, nullable: true}
        userEdited: {type: boolean, nullable: true, readOnly: true}
        displayOrder: {type: integer, nullable: true, readOnly: true}
    ProfileProject:
      type: object
      required: [name]
      properties:
        id: {type: integer, format: int64, minimum: 1, nullable: true}
        name: {type: string, minLength: 1, maxLength: 255}
        description: {type: string, maxLength: 5000, nullable: true}
        roleInProject: {type: string, maxLength: 150, nullable: true}
        techStack: {type: string, maxLength: 500, nullable: true}
        startDate: {type: string, format: date, nullable: true}
        endDate: {type: string, format: date, nullable: true}
        userEdited: {type: boolean, nullable: true, readOnly: true}
        displayOrder: {type: integer, nullable: true, readOnly: true}
    ProfileSummary:
      type: object
      required: [id, version, name, cvDocumentId, cvOriginalFilename, source, educationCount, skillCount, projectCount, createdAt, updatedAt]
      properties:
        id: {type: integer, format: int64}
        version: {type: integer, format: int64}
        name: {type: string}
        cvDocumentId: {type: integer, format: int64}
        cvOriginalFilename: {type: string}
        headline: {type: string, nullable: true}
        targetPosition: {type: string, nullable: true}
        seniorityLevel: {type: string, nullable: true}
        source: {type: string, enum: [AUTO_PARSED, USER_EDITED]}
        confirmedAt: {type: string, format: date-time, nullable: true}
        educationCount: {type: integer}
        skillCount: {type: integer}
        projectCount: {type: integer}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    CandidateProfile:
      type: object
      required: [id, version, name, cvDocumentId, cvOriginalFilename, source, createdAt, updatedAt, educations, skills, projects]
      properties:
        id: {type: integer, format: int64}
        version: {type: integer, format: int64}
        name: {type: string}
        cvDocumentId: {type: integer, format: int64}
        cvOriginalFilename: {type: string}
        headline: {type: string, nullable: true}
        summary: {type: string, nullable: true}
        yearsExperience: {type: number, multipleOf: 0.1, minimum: 0, maximum: 99.9, nullable: true}
        targetPosition: {type: string, nullable: true}
        seniorityLevel: {type: string, nullable: true}
        source: {type: string, enum: [AUTO_PARSED, USER_EDITED]}
        confirmedAt: {type: string, format: date-time, nullable: true}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
        educations: {type: array, items: {$ref: '#/components/schemas/ProfileEducation'}}
        skills: {type: array, items: {$ref: '#/components/schemas/ProfileSkill'}}
        projects: {type: array, items: {$ref: '#/components/schemas/ProfileProject'}}
    ProfileUpdateRequest:
      type: object
      required: [version, name, educations, skills, projects]
      properties:
        version: {type: integer, format: int64, minimum: 0}
        name: {type: string, minLength: 1, maxLength: 150}
        headline: {type: string, maxLength: 255, nullable: true}
        summary: {type: string, maxLength: 5000, nullable: true}
        yearsExperience: {type: number, multipleOf: 0.1, minimum: 0, maximum: 99.9, nullable: true}
        targetPosition: {type: string, maxLength: 150, nullable: true}
        seniorityLevel: {type: string, maxLength: 30, nullable: true}
        educations: {type: array, maxItems: 20, items: {$ref: '#/components/schemas/ProfileEducation'}}
        skills: {type: array, maxItems: 100, items: {$ref: '#/components/schemas/ProfileSkill'}}
        projects: {type: array, maxItems: 50, items: {$ref: '#/components/schemas/ProfileProject'}}
    CreateJobDescriptionTextRequest:
      type: object
      required: [title, text]
      properties:
        title: {type: string, minLength: 1, maxLength: 200}
        text: {type: string, minLength: 1, maxLength: 30000}
    JobAnalysis:
      type: object
      required: [sufficientJobContext, sourceLanguage, summary, keySkills]
      properties:
        sufficientJobContext: {type: boolean}
        sourceLanguage: {type: string, minLength: 1, maxLength: 20}
        jobTitle: {type: string, maxLength: 150, nullable: true}
        targetSeniority: {type: string, maxLength: 100, nullable: true}
        domain: {type: string, maxLength: 150, nullable: true}
        summary: {type: string, minLength: 1, maxLength: 3000}
        keySkills:
          type: array
          minItems: 1
          maxItems: 30
          items:
            type: object
            required: [name, level]
            properties:
              name: {type: string, minLength: 1, maxLength: 150}
              level: {type: string, enum: [MUST_HAVE, NICE_TO_HAVE]}
              description: {type: string, maxLength: 1000, nullable: true}
    JobDescription:
      type: object
      required: [id, sourceType, originalFilename, contentType, fileSizeBytes, status, uploadedAt, templateConfirmed]
      properties:
        id: {type: integer, format: int64}
        sourceType: {type: string, enum: [FILE, TEXT]}
        originalFilename: {type: string}
        contentType: {type: string}
        fileSizeBytes: {type: integer, format: int64}
        status: {type: string, enum: [UPLOADED, EXTRACTING, ANALYZING, READY, FAILED]}
        errorCode: {type: string, nullable: true}
        failureStage: {type: string, enum: [DISPATCH, EXTRACTION, ANALYSIS], nullable: true}
        statusMessage: {type: string, nullable: true}
        uploadedAt: {type: string, format: date-time}
        processedAt: {type: string, format: date-time, nullable: true}
        templateId: {type: integer, format: int64, nullable: true}
        templateConfirmed: {type: boolean}
        templateTitle: {type: string, nullable: true}
    JobDescriptionAnalysisResponse:
      type: object
      required: [jobDescriptionId, extractedText, analysis, schemaVersion, modelName, durationMs, createdAt]
      properties:
        jobDescriptionId: {type: integer, format: int64}
        extractedText: {type: string}
        analysis: {$ref: '#/components/schemas/JobAnalysis'}
        schemaVersion: {type: string}
        modelName: {type: string}
        durationMs: {type: integer}
        tokenCount: {type: integer, nullable: true}
        createdAt: {type: string, format: date-time}
    InterviewTemplateSummary:
      type: object
      required: [id, sourceJobDescriptionId, title, confirmed, published, updatedAt]
      properties:
        id: {type: integer, format: int64}
        sourceJobDescriptionId: {type: integer, format: int64}
        title: {type: string}
        jobTitle: {type: string, nullable: true}
        targetSeniority: {type: string, nullable: true}
        confirmed: {type: boolean}
        published: {type: boolean}
        archivedAt: {type: string, format: date-time, nullable: true}
        updatedAt: {type: string, format: date-time}
    InterviewTemplate:
      allOf:
        - {$ref: '#/components/schemas/InterviewTemplateSummary'}
        - type: object
          required: [content, version, createdAt]
          properties:
            content: {$ref: '#/components/schemas/JobAnalysis'}
            confirmedAt: {type: string, format: date-time, nullable: true}
            publishedAt: {type: string, format: date-time, nullable: true}
            version: {type: integer, format: int64}
            createdAt: {type: string, format: date-time}
    TemplatePage:
      type: object
      required: [content, page, size, totalElements]
      properties:
        content: {type: array, items: {$ref: '#/components/schemas/InterviewTemplateSummary'}}
        page: {type: integer}
        size: {type: integer}
        totalElements: {type: integer, format: int64}
    UpdateInterviewTemplateRequest:
      type: object
      required: [title, content, expectedVersion]
      properties:
        title: {type: string, minLength: 1, maxLength: 200}
        content: {$ref: '#/components/schemas/JobAnalysis'}
        expectedVersion: {type: integer, format: int64, minimum: 0}
    TemplateVersionRequest:
      type: object
      required: [expectedVersion]
      properties:
        expectedVersion: {type: integer, format: int64, minimum: 0}
    InterviewerStyle: {type: string, enum: [FRIENDLY, PROFESSIONAL, CHALLENGING]}
    InterviewSessionMode: {type: string, enum: [TURN_BASED, VOICE_REALTIME]}
    InterviewTurnInputMode: {type: string, enum: [TEXT, VOICE, VOICE_REALTIME]}
    InterviewSessionStatusEnum:
      type: string
      enum: [PREPARING, READY, PREPARATION_FAILED, IN_PROGRESS, SCORING, COMPLETED, SCORING_FAILED, CANCELLED, EXPIRED]
    InterviewEndReason:
      type: string
      enum: [AI_COMPLETED, TIME_EXPIRED, CANDIDATE_FINISHED, SYSTEM_TERMINATED]
      nullable: true
    InterviewSessionOptions:
      type: object
      required: [languages, durations, interviewerStyles, modes]
      properties:
        languages: {type: array, items: {$ref: '#/components/schemas/InterviewOption'}}
        durations: {type: array, items: {type: integer}}
        interviewerStyles: {type: array, items: {$ref: '#/components/schemas/InterviewOption'}}
        modes: {type: array, items: {$ref: '#/components/schemas/InterviewOption'}}
    InterviewOption:
      type: object
      required: [code, name]
      properties:
        code: {type: string}
        name: {type: string}
    CreateInterviewSessionRequest:
      type: object
      required: [templateId, profileId, languageCode, durationMinutes, interviewerStyle]
      properties:
        templateId: {type: integer, format: int64, minimum: 1}
        profileId: {type: integer, format: int64, minimum: 1}
        languageCode: {type: string, minLength: 1, maxLength: 10}
        durationMinutes: {type: integer, minimum: 1}
        interviewerStyle: {$ref: '#/components/schemas/InterviewerStyle'}
        mode: {$ref: '#/components/schemas/InterviewSessionMode'}
    InterviewSessionStatus:
      type: object
      required: [id, status, templateTitle, profileName, languageCode, durationMinutes, interviewerStyle, mode]
      properties:
        id: {type: integer, format: int64}
        status: {$ref: '#/components/schemas/InterviewSessionStatusEnum'}
        templateTitle: {type: string}
        profileName: {type: string}
        languageCode: {type: string}
        durationMinutes: {type: integer}
        interviewerStyle: {$ref: '#/components/schemas/InterviewerStyle'}
        mode: {$ref: '#/components/schemas/InterviewSessionMode'}
        realtimeProvider: {type: string, nullable: true}
        realtimeVoiceName: {type: string, nullable: true}
        preparationErrorCode: {type: string, nullable: true}
        preparationErrorMessage: {type: string, nullable: true}
        scoringErrorCode: {type: string, nullable: true}
        scoringErrorMessage: {type: string, nullable: true}
        preparedAt: {type: string, format: date-time, nullable: true}
        endReason: {$ref: '#/components/schemas/InterviewEndReason'}
        endedAt: {type: string, format: date-time, nullable: true}
        completedAt: {type: string, format: date-time, nullable: true}
    CreateRealtimeSessionRequest:
      type: object
      properties:
        voiceName: {type: string, maxLength: 50, nullable: true}
        clientPlatform: {type: string, maxLength: 50, nullable: true}
    RealtimeAudioFormat:
      type: object
      required: [mimeType, sampleRate, bitDepth, channels]
      properties:
        mimeType: {type: string}
        sampleRate: {type: integer, minimum: 1}
        bitDepth: {type: integer, minimum: 1}
        channels: {type: integer, minimum: 1}
    RealtimeSessionGrant:
      type: object
      required: [connectionId, provider, transport, endpoint, accessToken, modelName, voiceName, inputAudio, outputAudio, expiresAt, sessionSetup]
      properties:
        connectionId: {type: integer, format: int64}
        provider: {type: string}
        transport: {type: string, enum: [WEBRTC, WEBSOCKET]}
        endpoint: {type: string, format: uri}
        accessToken: {type: string, format: password}
        modelName: {type: string}
        voiceName: {type: string}
        inputAudio: {$ref: '#/components/schemas/RealtimeAudioFormat'}
        outputAudio: {$ref: '#/components/schemas/RealtimeAudioFormat'}
        expiresAt: {type: string, format: date-time}
        sessionSetup:
          type: object
          additionalProperties: true
    RealtimeEventType:
      type: string
      enum: [SESSION_CONNECTED, SESSION_RESUMPTION_UPDATED, USER_SPEECH_STARTED, USER_TRANSCRIPT_PARTIAL, USER_TRANSCRIPT_FINAL, ASSISTANT_SPEECH_STARTED, ASSISTANT_TRANSCRIPT_FINAL, ASSISTANT_INTERRUPTED, SESSION_DISCONNECTED, PROVIDER_ERROR]
    RealtimeEventRequest:
      type: object
      required: [providerEventId, sequenceNumber, eventType, occurredAt]
      properties:
        providerEventId: {type: string, minLength: 1, maxLength: 255}
        sequenceNumber: {type: integer, format: int64, minimum: 0}
        eventType: {$ref: '#/components/schemas/RealtimeEventType'}
        transcriptText: {type: string, maxLength: 16000, nullable: true}
        detail: {type: string, maxLength: 65535, nullable: true}
        latencyMs: {type: integer, minimum: 0, maximum: 600000, nullable: true}
        occurredAt: {type: string, format: date-time}
    RealtimeEventBatchRequest:
      type: object
      required: [events]
      properties:
        events:
          type: array
          minItems: 1
          maxItems: 100
          items: {$ref: '#/components/schemas/RealtimeEventRequest'}
    RealtimeEventBatchResponse:
      type: object
      required: [connectionId, acceptedEventCount, duplicateEventCount, createdTurnCount, currentTurnIndex]
      properties:
        connectionId: {type: integer, format: int64}
        acceptedEventCount: {type: integer, minimum: 0}
        duplicateEventCount: {type: integer, minimum: 0}
        createdTurnCount: {type: integer, minimum: 0}
        currentTurnIndex: {type: integer, minimum: 0}
    CreateRealtimeResumeRequest:
      type: object
      required: [resumptionHandle]
      properties:
        resumptionHandle: {type: string, minLength: 1, maxLength: 65535}
        clientPlatform: {type: string, maxLength: 50, nullable: true}
    DisconnectRealtimeConnectionRequest:
      type: object
      required: [fallbackToTurnBased]
      properties:
        reason: {type: string, maxLength: 255, nullable: true}
        fallbackToTurnBased: {type: boolean}
        p50LatencyMs: {type: integer, minimum: 0, maximum: 600000, nullable: true}
        p95LatencyMs: {type: integer, minimum: 0, maximum: 600000, nullable: true}
    RealtimeConnection:
      type: object
      required: [connectionId, sessionMode, fellBackToTurnBased]
      properties:
        connectionId: {type: integer, format: int64}
        sessionMode: {$ref: '#/components/schemas/InterviewSessionMode'}
        connectedAt: {type: string, format: date-time, nullable: true}
        disconnectedAt: {type: string, format: date-time, nullable: true}
        disconnectReason: {type: string, nullable: true}
        fellBackToTurnBased: {type: boolean}
        p50LatencyMs: {type: integer, minimum: 0, nullable: true}
        p95LatencyMs: {type: integer, minimum: 0, nullable: true}
    CandidateIntent:
      type: string
      enum: [ANSWER, REQUEST_REPEAT, REQUEST_CLARIFICATION, REQUEST_TIME, ASK_INTERVIEWER, CANNOT_ANSWER, DECLINE_OR_SKIP, CORRECT_PREVIOUS_ANSWER, REQUEST_END, SOCIAL_OR_META, OFF_TOPIC, INAPPROPRIATE, OTHER]
      nullable: true
    InterviewTurnAction:
      type: string
      enum: [OPENING, EXPLORE, FOLLOW_UP, HANDLE_REQUEST, CLOSE]
      nullable: true
    InterviewTurn:
      type: object
      required: [id, turnIndex, role, inputMode, content, wasInterrupted, createdAt]
      properties:
        id: {type: integer, format: int64}
        turnIndex: {type: integer}
        role: {type: string, enum: [INTERVIEWER, CANDIDATE]}
        inputMode: {$ref: '#/components/schemas/InterviewTurnInputMode'}
        content: {type: string}
        candidateIntent: {$ref: '#/components/schemas/CandidateIntent'}
        action: {$ref: '#/components/schemas/InterviewTurnAction'}
        focusAreaCode: {type: string, nullable: true}
        requestId: {type: string, nullable: true}
        processingStatus: {type: string, enum: [PROCESSING, COMPLETED, FAILED], nullable: true}
        processingErrorCode: {type: string, nullable: true}
        wasInterrupted: {type: boolean}
        latencyMs: {type: integer, minimum: 0, nullable: true}
        createdAt: {type: string, format: date-time}
    InterviewConversation:
      type: object
      required: [sessionId, status, mode, remainingSeconds, currentTurnIndex, turns]
      properties:
        sessionId: {type: integer, format: int64}
        status: {$ref: '#/components/schemas/InterviewSessionStatusEnum'}
        mode: {$ref: '#/components/schemas/InterviewSessionMode'}
        realtimeProvider: {type: string, nullable: true}
        realtimeVoiceName: {type: string, nullable: true}
        startedAt: {type: string, format: date-time, nullable: true}
        deadlineAt: {type: string, format: date-time, nullable: true}
        endReason: {$ref: '#/components/schemas/InterviewEndReason'}
        endedAt: {type: string, format: date-time, nullable: true}
        remainingSeconds: {type: integer, format: int64, minimum: 0}
        currentTurnIndex: {type: integer, minimum: 0}
        turns: {type: array, items: {$ref: '#/components/schemas/InterviewTurn'}}
    SubmitInterviewAnswerRequest:
      type: object
      required: [expectedTurnIndex, answer, inputMode]
      properties:
        expectedTurnIndex: {type: integer, minimum: 0}
        answer: {type: string, minLength: 1, maxLength: 8000}
        inputMode: {type: string, enum: [TEXT, VOICE]}
    SpeechTranscription:
      type: object
      required: [text, languageCode]
      properties:
        text: {type: string, minLength: 1}
        languageCode: {type: string, enum: [en, ja, vi]}
    InterviewAnswerResponse:
      type: object
      required: [sessionId, status, remainingSeconds, currentTurnIndex]
      properties:
        sessionId: {type: integer, format: int64}
        status: {$ref: '#/components/schemas/InterviewSessionStatusEnum'}
        deadlineAt: {type: string, format: date-time, nullable: true}
        endReason: {$ref: '#/components/schemas/InterviewEndReason'}
        endedAt: {type: string, format: date-time, nullable: true}
        remainingSeconds: {type: integer, format: int64, minimum: 0}
        currentTurnIndex: {type: integer, minimum: 0}
        candidateTurn:
          type: object
          allOf: [{$ref: '#/components/schemas/InterviewTurn'}]
          nullable: true
        interviewerTurn:
          type: object
          allOf: [{$ref: '#/components/schemas/InterviewTurn'}]
          nullable: true
    InterviewReport:
      type: object
      required: [sessionId, status, report]
      properties:
        sessionId: {type: integer, format: int64}
        status: {$ref: '#/components/schemas/InterviewSessionStatusEnum'}
        scoringErrorCode: {type: string, nullable: true}
        scoringErrorMessage: {type: string, nullable: true}
        report:
          allOf: [{$ref: '#/components/schemas/InterviewReportContent'}]
          nullable: true
        completedAt: {type: string, format: date-time, nullable: true}
    InterviewReportContent:
      type: object
      required: [summary, scores, focusAreas, recommendations]
      properties:
        score: {type: number, nullable: true}
        summary: {type: string, maxLength: 400}
        scores: {$ref: '#/components/schemas/InterviewScoreBreakdown'}
        focusAreas:
          type: array
          items: {$ref: '#/components/schemas/InterviewFocusAreaScore'}
        recommendations:
          type: array
          maxItems: 3
          items: {type: string, maxLength: 200}
    InterviewScoreBreakdown:
      type: object
      required: [technical, communication]
      properties:
        technical: {$ref: '#/components/schemas/InterviewScoreFeedback'}
        communication: {$ref: '#/components/schemas/InterviewScoreFeedback'}
    InterviewScoreFeedback:
      type: object
      required: [feedback]
      properties:
        score: {type: number, nullable: true}
        feedback: {type: string, maxLength: 300}
    InterviewFocusAreaScore:
      type: object
      required: [name]
      properties:
        name: {type: string}
        score: {type: number, nullable: true}

security:
  - bearerAuth: []
